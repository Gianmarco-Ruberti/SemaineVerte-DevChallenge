<!doctype html>
<html>
  <head>
    <title>Table des notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="etml">ETML</p>
      </div>
    </header>
    <h1>Système de notes</h1>

    <div class="form">
      <select id="subjectSelect">
        <optgroup label="Modules"></optgroup>
      </select>
      <input id="score" type="number" placeholder="Score" min="1" max="6" />
      <input
        id="semestre"
        type="number"
        placeholder="Semestre"
        min="1"
        max="2"
      />
      <button onclick="addGrade()">Ajouter</button>
    </div>
    <div class="form">
      <input id="newSubject" placeholder="Nouveau module" />
      <button onclick="addSubject()">Ajouter un module</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Module</th>
          <th>Note S1</th>
          <th>Note S2</th>
          <th>Moyenne S1</th>
          <th>Moyenne S2</th>
          <th>Moyenne Annuelle</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>

    <script src="app.js"></script>
  </body>
</html>
